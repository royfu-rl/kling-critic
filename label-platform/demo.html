<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标注平台 · 双人盲标 Demo</title>
<style>
  :root{--bg:#fff;--soft:#f6f7f9;--band:#f0f2f5;--ink:#111418;--mute:#5b636e;--faint:#8a929e;
    --line:#e4e7ec;--brand:#2f6bff;--ok:#1a7f45;--no:#c0392b;--mild:#b8860b;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{display:grid;grid-template-columns:208px minmax(0,1fr) 290px;height:100vh;min-height:560px}
  @media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}

  /* ── 左：账号与样本 ── */
  .side{border-right:1px solid var(--line);background:var(--soft);padding:14px;overflow:auto}
  .kick{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
  .who{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:14px}
  .who b{display:block;font-size:14px}
  .who span{color:var(--mute);font-size:12px}
  .roles{display:grid;gap:5px;margin-top:9px}
  .roles button{font:inherit;font-size:12px;text-align:left;padding:6px 9px;border-radius:7px;
    border:1px solid var(--line);background:#fff;color:var(--mute);cursor:pointer;transition:.12s}
  .roles button:hover{border-color:#c5cad3;color:var(--ink)}
  .roles button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .cases{list-style:none;margin:0;padding:0;display:grid;gap:5px}
  .cases button{width:100%;font:inherit;font-size:12.5px;text-align:left;padding:8px 10px;border-radius:8px;
    border:1px solid var(--line);background:#fff;cursor:pointer;transition:.12s}
  .cases button:hover{border-color:#c5cad3}
  .cases button.on{border-color:var(--brand);background:#eef3ff}
  .cases .u{display:block;font-family:var(--mono);font-size:11px;color:var(--faint)}

  /* ── 中：视频与证据框 ── */
  .main{padding:16px 18px;overflow:auto;min-width:0}
  .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:3px}
  .head h2{margin:0;font-size:17px;letter-spacing:-.01em}
  .chip{font:600 10.5px/1.7 var(--mono);letter-spacing:.05em;text-transform:uppercase;
    padding:1px 8px;border-radius:999px;background:var(--band);color:var(--mute)}
  .sub{margin:0 0 12px;color:var(--mute);font-size:12.5px}
  .stage{position:relative;background:#0b0d10;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-height:330px}
  .stage video{width:100%;height:100%;object-fit:contain;display:block}
  .box{position:absolute;border:2px solid #ff4d4f;border-radius:3px;box-shadow:0 0 0 1px #0006;pointer-events:none;
    opacity:0;transition:opacity .15s}
  .box.on{opacity:1}
  .box i{position:absolute;left:0;top:-19px;font:600 10.5px/16px var(--mono);font-style:normal;
    background:#ff4d4f;color:#fff;padding:0 6px;border-radius:3px;white-space:nowrap}
  .track{position:relative;height:5px;border-radius:3px;background:var(--band);margin:9px 0 2px}
  .track i{position:absolute;top:0;height:100%;border-radius:3px;background:#ff4d4f;opacity:.75}
  .tmeta{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--faint)}

  .evs{margin-top:14px;display:grid;gap:9px}
  .ev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;transition:.12s}
  .ev.sel{border-color:var(--brand);box-shadow:0 0 0 3px #2f6bff14}
  .ev-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ev-top b{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:600}
  .ev-obs{margin:5px 0 0;font-size:13px}
  .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .acts button{font:inherit;font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:var(--mute);transition:.12s}
  .acts button:hover{border-color:#c5cad3;color:var(--ink)}
  .acts button.on[data-v="采纳"]{background:#e8f6ee;border-color:#8fcfa9;color:var(--ok)}
  .acts button.on[data-v="驳回"]{background:#fdecea;border-color:#eda79e;color:var(--no)}
  .acts button.on[data-v="轻微"]{background:#fdf5e3;border-color:#e3c97f;color:var(--mild)}
  .seen{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--faint)}
  .seen span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .blind{color:var(--faint);font-style:italic}

  /* ── 右：仲裁与指标 ── */
  .aside{border-left:1px solid var(--line);background:var(--soft);padding:14px;overflow:auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:12px}
  .lad{display:grid;gap:6px;margin:0;padding:0;list-style:none;counter-reset:s}
  .lad li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;color:var(--faint)}
  .lad li b{font-weight:600}
  .lad li.hit{color:var(--ink)}
  .lad li.hit .n{background:var(--ink);color:#fff;border-color:var(--ink)}
  .lad .n{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;
    border:1px solid var(--line);font:600 10px var(--mono);background:#fff}
  .verdict{display:flex;align-items:baseline;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .verdict b{font-size:20px;letter-spacing:-.02em}
  .verdict.yes b{color:var(--no)} .verdict.no b{color:var(--ok)}
  .mx{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  .mx th,.mx td{border:1px solid var(--line);padding:4px 7px;text-align:center}
  .mx th{background:var(--soft);color:var(--mute);font-weight:600;font-size:11px}
  .mx td.hi{background:#eef3ff;font-weight:700}
  .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .num{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  .num b{display:block;font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .num span{font-size:11px;color:var(--faint)}
  .foot{color:var(--faint);font-size:11.5px;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <p class="kick">当前标注账号</p>
    <div class="who">
      <b id="whoName">—</b><span id="whoRole">—</span>
      <div class="roles" id="roles"></div>
    </div>
    <p class="kick">我的样本</p>
    <ul class="cases" id="cases"></ul>
  </aside>

  <main class="main">
    <div class="head"><h2 id="caseTitle">—</h2><span class="chip" id="caseTag">—</span></div>
    <p class="sub" id="casePrompt">—</p>
    <div class="stage">
      <video id="vid" muted playsinline loop></video>
      <div id="boxes"></div>
    </div>
    <div class="track" id="track"></div>
    <div class="tmeta"><span id="tnow">0.0s</span><span id="tdur">—</span></div>
    <div class="evs" id="evs"></div>
  </main>

  <aside class="aside">
    <div class="card">
      <p class="kick">终态怎么定 <span id="ladderNote" style="text-transform:none;letter-spacing:0;font-weight:400"></span></p>
      <ul class="lad" id="ladder"></ul>
      <div class="verdict" id="verdict"><span>视频级结论</span><b>—</b></div>
    </div>
    <div class="card">
      <p class="kick">人评一致性</p>
      <table class="mx" id="mx"></table>
      <p class="foot" id="agree">—</p>
    </div>
    <div class="card">
      <p class="kick">抽检标注准召</p>
      <div class="nums" id="prf"></div>
      <p class="foot">以评测员终审为真值，统计标注员提交的证据。</p>
    </div>
  </aside>
</div>

<script>
const ROLES = [{"id": "annotator_1", "name": "标注员 A", "role": "盲标槽位 1", "sees": ["annotator_1"]}, {"id": "annotator_2", "name": "标注员 B", "role": "盲标槽位 2", "sees": ["annotator_2"]}, {"id": "reviewer_3", "name": "复核员", "role": "分歧仲裁", "sees": ["annotator_1", "annotator_2", "reviewer_3"]}, {"id": "admin", "name": "评测员", "role": "终审", "sees": ["annotator_1", "annotator_2", "reviewer_3", "admin"]}], CASES = [{"uid": "vf_6004655", "video": "vf_6004655.mp4", "tag": "文字不可读", "prompt": "街边霓虹灯牌缓缓亮起，镜头推近", "truth": "有", "path": "两人一致 · 直接采纳", "evidences": [{"id": "e1", "tr": [1.2, 2.8], "bbox": [0.41, 0.28, 0.33, 0.17], "obs": "灯牌文字笔画粘连，第 2 秒起无法辨认", "marks": {"annotator_1": "采纳", "annotator_2": "采纳"}, "sev": 2}], "video_marks": {"annotator_1": "有", "annotator_2": "有"}}, {"uid": "vf_1003674", "video": "vf_1003674.mp4", "tag": "崩坏", "prompt": "舞者旋转，裙摆展开", "truth": "有", "path": "两人分歧 · 复核员定终态", "evidences": [{"id": "e1", "tr": [0.6, 1.4], "bbox": [0.52, 0.33, 0.2, 0.3], "obs": "右手在转身瞬间出现第六指", "marks": {"annotator_1": "采纳", "annotator_2": null, "reviewer_3": "采纳"}, "sev": 3}, {"id": "e2", "tr": [2.1, 2.6], "bbox": [0.18, 0.55, 0.16, 0.2], "obs": "裙摆边缘闪烁", "marks": {"annotator_1": "采纳", "reviewer_3": "驳回"}, "sev": 1}], "video_marks": {"annotator_1": "有", "annotator_2": "无", "reviewer_3": "有"}}, {"uid": "vf_3005976", "video": "vf_3005976.mp4", "tag": "生物类结构异常", "prompt": "一只鹿走过雪地", "truth": "无", "path": "评测员改判 · 推翻复核", "evidences": [{"id": "e1", "tr": [1.0, 1.9], "bbox": [0.3, 0.4, 0.26, 0.28], "obs": "后腿关节方向可疑", "marks": {"annotator_1": "采纳", "reviewer_3": "采纳", "admin": "驳回"}, "sev": 1}], "video_marks": {"annotator_1": "有", "annotator_2": "无", "reviewer_3": "有", "admin": "无"}}], MEDIA = "assets/videos/";
const MARKS = ['采纳', '驳回', '轻微'];
let me = ROLES[0], cur = CASES[0], sel = null;
// 本地改动只活在这一次会话里；线上平台写的是服务端标注日志
const edits = {};

// Keep this script free of dollar signs: build.py lifts LaTeX out of the
// markdown before marked runs, and a dollar pair here would be mangled.
const el = id => document.getElementById(id);
const key = (c, e) => c.uid + '|' + e.id;
const markOf = (c, e, who) => (edits[key(c, e)] || {})[who] ?? (e.marks[who] ?? null);

// ── 终态：评测员 > 复核员 > 两人一致 > 未定（与线上同一口径）
function settle(c) {
  const v = c.video_marks;
  if (v.admin) return { by: 'admin', step: 0, value: v.admin };
  if (v.annotator_1 && v.annotator_2 && v.annotator_1 === v.annotator_2)
    return { by: 'agree', step: 1, value: v.annotator_1 };
  if (v.reviewer_3) return { by: 'reviewer_3', step: 2, value: v.reviewer_3 };
  return { by: null, step: 3, value: null };
}
function evSettle(c, e) {
  for (const who of ['admin', 'reviewer_3', 'annotator_1', 'annotator_2']) {
    const m = markOf(c, e, who);
    if (m) return { who, value: m };
  }
  return { who: null, value: null };
}

function renderRoles() {
  el('roles').innerHTML = '';
  ROLES.forEach(r => {
    const b = document.createElement('button');
    b.textContent = r.name + ' · ' + r.role;
    b.className = r.id === me.id ? 'on' : '';
    b.onclick = () => { me = r; renderAll(); };
    el('roles').appendChild(b);
  });
  el('whoName').textContent = me.name;
  el('whoRole').textContent = me.role + ' · 可见 ' + me.sees.length + ' 人的标注';
}

function renderCases() {
  el('cases').innerHTML = '';
  CASES.forEach(c => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.className = c.uid === cur.uid ? 'on' : '';
    b.innerHTML = '<span class="u">' + c.uid + '</span>' + c.tag;
    b.onclick = () => { cur = c; sel = null; renderAll(); };
    li.appendChild(b); el('cases').appendChild(li);
  });
}

function renderCase() {
  el('caseTitle').textContent = cur.uid;
  el('caseTag').textContent = cur.tag;
  el('casePrompt').textContent = '提示词：' + cur.prompt + ' · ' + cur.path;
  const v = el('vid');
  if (!v.src.endsWith(cur.video)) { v.src = MEDIA + cur.video; v.load(); v.play().catch(() => {}); }

  el('boxes').innerHTML = '';
  cur.evidences.forEach((e, i) => {
    const d = document.createElement('div');
    d.className = 'box'; d.dataset.ev = e.id;
    d.style.cssText = 'left:' + e.bbox[0] * 100 + '%;top:' + e.bbox[1] * 100
      + '%;width:' + e.bbox[2] * 100 + '%;height:' + e.bbox[3] * 100 + '%';
    d.innerHTML = '<i>' + cur.tag + ' #' + (i + 1) + '</i>';
    el('boxes').appendChild(d);
  });

  el('evs').innerHTML = '';
  cur.evidences.forEach((e, i) => {
    const card = document.createElement('div');
    card.className = 'ev' + (sel === e.id ? ' sel' : '');
    card.onmouseenter = () => { sel = e.id; paintBoxes(); };
    const mine = markOf(cur, e, me.id);
    const others = me.sees.filter(w => w !== me.id)
      .map(w => [w, markOf(cur, e, w)]).filter(([, m]) => m);
    const fin = evSettle(cur, e);

    card.innerHTML =
      '<div class="ev-top"><b>#' + (i + 1) + '</b>'
      + '<span class="chip">' + e.tr[0].toFixed(1) + 's – ' + e.tr[1].toFixed(1) + 's</span>'
      + '<span class="chip">severity ' + e.sev + '</span></div>'
      + '<p class="ev-obs">' + e.obs + '</p>';

    const acts = document.createElement('div');
    acts.className = 'acts';
    MARKS.forEach(m => {
      const b = document.createElement('button');
      b.dataset.v = m; b.textContent = m;
      b.className = mine === m ? 'on' : '';
      b.onclick = () => {
        const k = key(cur, e);
        edits[k] = Object.assign({}, edits[k]);
        edits[k][me.id] = mine === m ? null : m;
        renderAll();
      };
      acts.appendChild(b);
    });
    card.appendChild(acts);

    const seen = document.createElement('div');
    seen.className = 'seen';
    if (others.length) {
      seen.innerHTML = others.map(([w, m]) =>
        '<span>' + (ROLES.find(r => r.id === w) || {}).name + '：' + m + '</span>').join('');
    } else {
      seen.innerHTML = '<span class="blind">盲标中 · 看不到其他标注员</span>';
    }
    // 终态由他人判断推出，盲标槽位看不到
    if (fin.value && me.sees.length > 1) {
      seen.innerHTML += '<span>终态：' + fin.value + '（'
        + (ROLES.find(r => r.id === fin.who) || {}).name + '）</span>';
    }
    card.appendChild(seen);
    el('evs').appendChild(card);
  });
  paintBoxes();
}

function paintBoxes() {
  const t = el('vid').currentTime || 0;
  document.querySelectorAll('.box').forEach(d => {
    const e = cur.evidences.find(x => x.id === d.dataset.ev);
    d.classList.toggle('on', !!e && ((t >= e.tr[0] && t <= e.tr[1]) || sel === e.id));
  });
  document.querySelectorAll('.ev').forEach((c, i) =>
    c.classList.toggle('sel', cur.evidences[i] && sel === cur.evidences[i].id));
}

function renderTrack() {
  const d = el('vid').duration;
  el('track').innerHTML = '';
  if (!d || !isFinite(d)) return;
  cur.evidences.forEach(e => {
    const i = document.createElement('i');
    i.style.left = (e.tr[0] / d * 100) + '%';
    i.style.width = Math.max(1.5, (e.tr[1] - e.tr[0]) / d * 100) + '%';
    el('track').appendChild(i);
  });
  el('tdur').textContent = d.toFixed(1) + 's';
}

function renderLadder() {
  const s = settle(cur);
  el('ladderNote').textContent = me.sees.length > 1 ? '' : '· 盲标槽位看不到这一栏';
  el('ladderNote').style.opacity = me.sees.length > 1 ? '1' : '.7';
  const steps = [
    ['评测员终审', 'admin'], ['两名标注员一致', 'agree'],
    ['复核员仲裁', 'reviewer_3'], ['不交付 · 分歧未复核', null],
  ];
  el('ladder').innerHTML = steps.map(([label], i) =>
    '<li class="' + (i === s.step ? 'hit' : '') + '"><span class="n">' + (i + 1) + '</span>'
    + '<span>' + (i === s.step ? '<b>' + label + '</b>' : label) + '</span></li>').join('');
  const v = el('verdict');
  v.className = 'verdict ' + (s.value === '有' ? 'yes' : s.value === '无' ? 'no' : '');
  v.innerHTML = '<span>视频级结论</span><b>' + (s.value || '未定') + '</b>';
}

// 人评一致性：两名标注员在视频级结论上的一致率
function renderMetrics() {
  let same = 0, both = 0;
  const cm = { '有有': 0, '有无': 0, '无有': 0, '无无': 0 };
  CASES.forEach(c => {
    const a = c.video_marks.annotator_1, b = c.video_marks.annotator_2;
    if (!a || !b) return;
    both++; if (a === b) same++;
    cm[a + b] = (cm[a + b] || 0) + 1;
  });
  el('mx').innerHTML =
    '<tr><th></th><th>B 判有</th><th>B 判无</th></tr>'
    + '<tr><th>A 判有</th><td class="hi">' + cm['有有'] + '</td><td>' + cm['有无'] + '</td></tr>'
    + '<tr><th>A 判无</th><td>' + cm['无有'] + '</td><td class="hi">' + cm['无无'] + '</td></tr>';
  el('agree').textContent = both
    ? '一致 ' + same + ' / ' + both + '，一致率 ' + (same / both * 100).toFixed(0) + '%；不一致的进复核。'
    : '样本不足。';

  // 抽检准召：以终审为真值，看标注员提交的证据被采纳的比例
  let tp = 0, fp = 0, fn = 0;
  CASES.forEach(c => c.evidences.forEach(e => {
    const claimed = ['annotator_1', 'annotator_2'].some(w => markOf(c, e, w) === '采纳' || markOf(c, e, w) === '轻微');
    const truth = evSettle(c, e).value;
    const kept = truth === '采纳' || truth === '轻微';
    if (claimed && kept) tp++; else if (claimed && !kept) fp++; else if (!claimed && kept) fn++;
  }));
  const P = tp + fp ? tp / (tp + fp) : 0, R = tp + fn ? tp / (tp + fn) : 0;
  const F = P + R ? 2 * P * R / (P + R) : 0;
  el('prf').innerHTML =
    '<div class="num"><b>' + (P * 100).toFixed(0) + '%</b><span>准确率 · ' + tp + '/' + (tp + fp) + '</span></div>'
    + '<div class="num"><b>' + (R * 100).toFixed(0) + '%</b><span>召回率 · ' + tp + '/' + (tp + fn) + '</span></div>'
    + '<div class="num"><b>' + F.toFixed(2) + '</b><span>F1</span></div>'
    + '<div class="num"><b>' + (tp + fp + fn) + '</b><span>抽检证据数</span></div>';
}

function renderAll() { renderRoles(); renderCases(); renderCase(); renderLadder(); renderMetrics(); }

el('vid').addEventListener('timeupdate', () => {
  paintBoxes();
  el('tnow').textContent = (el('vid').currentTime || 0).toFixed(1) + 's';
});
el('vid').addEventListener('loadedmetadata', renderTrack);
renderAll();
</script>
</body>
</html>

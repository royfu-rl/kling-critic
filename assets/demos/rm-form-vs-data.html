<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar comparison</title>
<style>
  :root{
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --ink:#1a1a1a;--muted:#9a9aa0;--muted2:#b8b8be;--border:#e6e6e6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#f4f4f5;font-family:var(--font);color:var(--ink);
    -webkit-font-smoothing:antialiased;padding:40px 20px;display:flex;justify-content:center;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:32px 36px 30px;
    width:100%;max-width:920px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.05);}
  .title{font-size:20px;font-weight:650;letter-spacing:-.01em;margin:0;line-height:1.3;max-width:640px;}
  .subtitle{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.5;max-width:640px;}
  .panel{margin-top:26px;}
  .panel-head{margin-bottom:6px;}
  .panel-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35;}
  .panel-sub{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px;}
  .note{font-size:13.5px;color:var(--muted);margin-top:22px;line-height:1.5;max-width:640px;}
  svg text{font-family:var(--font);}
  .bar{transition:opacity .15s;}
  .row:hover .bar{opacity:.85;}
  .hit{cursor:default;}
  #tip{position:fixed;z-index:50;pointer-events:none;background:#111;color:#fff;border-radius:8px;
    padding:8px 11px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;transition:opacity .12s;white-space:nowrap;}
  #tip .t-cat{font-weight:600;} #tip b{color:#fff;}
</style>
</head>
<body>
<div class="card">
  <h2 class="title" id="title"></h2>
  <p class="subtitle" id="subtitle"></p>
  <div id="panels"></div>
  <p class="note" id="note"></p>
</div>
<div id="tip"></div>

<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║  DATA — edit this block only.                                 ║
   ╚══════════════════════════════════════════════════════════════╝
   Horizontal bar comparison. One or more PANELS, each a small bar
   chart that shares the same layout. In every panel the rows you mark
   `hi:true` render dark/solid (the entity you're spotlighting); the
   rest are muted grey — so the reader's eye lands on the comparison.

   Each panel has its own scale. Set `max` to the axis top (or null to
   auto-fit from the data) and `unit` for the value suffix. `disp` lets
   you control the printed value (defaults to the raw number).            */
const TITLE    = "同一份数据、同一个基座：换形态换来 1.3 个点，加数据换来 10.1 个点";
const SUBTITLE = "VideoDRM / VideoGRM 的对照实验——数据 VUP-35K 与基座 Qwen3VL-8B 完全一致，只改训练形态。";
const NOTE     = "深色是判别式；VURB 总体准确率。";

const PANELS = [
  {
    title: "VURB 总体准确率",
    sub:   "判别式 vs 生成式 vs 闭源",
    max:   70, unit: "%",
    ticks: [{v:0,t:"0"},{v:20,t:"20"},{v:40,t:"40"},{v:60,t:"60"},{v:70,t:"70"}],
    rows: [
      {label:"Qwen3VL-8B（基座）", value:52.4, disp:"52.4%"},
      {label:"VideoGRM（生成式）",  value:59.3, disp:"59.3%"},
      {label:"GPT-5.2（闭源）",     value:62.9, disp:"62.9%"},
      {label:"VideoDRM（判别式）",  value:63.8, disp:"63.8%", hi:true},
    ],
  },
  {
    title: "增量拆开看：哪一部分是数据带来的",
    sub:   "基座 52.4% 起算",
    max:   12, unit: " 个点",
    ticks: [{v:0,t:"0"},{v:3,t:"3"},{v:6,t:"6"},{v:9,t:"9"},{v:12,t:"12"}],
    rows: [
      {label:"只加 VUP-35K 数据", value:10.1, disp:"+10.1", hi:true},
      {label:"再换成判别式形态",   value:1.3,  disp:"+1.3"},
    ],
  },
];
/* ────────────────────────── end DATA ────────────────────────── */

const tip=document.getElementById("tip");
function showTip(html,e){tip.innerHTML=html;tip.style.opacity=1;moveTip(e);}
function moveTip(e){const pad=14;let x=e.clientX+pad,y=e.clientY+pad;const r=tip.getBoundingClientRect();
  if(x+r.width>innerWidth)x=e.clientX-r.width-pad;if(y+r.height>innerHeight)y=e.clientY-r.height-pad;
  tip.style.left=x+"px";tip.style.top=y+"px";}
function hideTip(){tip.style.opacity=0;}
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const x=document.createElementNS(NS,n);for(const k in a)x.setAttribute(k,a[k]);return x;};

function niceTicks(max){ return [{v:0,t:"0"},{v:max/2,t:String(+(max/2).toFixed(1))},{v:max,t:String(+max.toFixed(1))}]; }

function renderPanel(p){
  const VBW=720, rowH=32, top=8, axisH=28;
  const labelW=150, plotL=labelW, plotR=VBW-28;
  const H=top+p.rows.length*rowH+axisH;
  const max=p.max ?? Math.max(...p.rows.map(r=>r.value))*1.1;
  const ticks=p.ticks ?? niceTicks(max);
  const x=v=>plotL+(v/max)*(plotR-plotL);

  const wrap=document.createElement("div");wrap.className="panel";
  if(p.title){
    const h=document.createElement("div");h.className="panel-head";
    h.innerHTML=`<div class="panel-title">${p.title}</div>`+(p.sub?`<div class="panel-sub">${p.sub}</div>`:"");
    wrap.appendChild(h);
  }
  const svg=el("svg",{viewBox:`0 0 ${VBW} ${H}`,width:"100%",role:"img","aria-label":p.title||"bar chart"});
  svg.style.display="block";svg.style.marginTop="6px";
  const plotBot=top+p.rows.length*rowH;

  ticks.forEach((tk,i)=>{
    const gx=x(tk.v);
    svg.appendChild(el("line",{x1:gx,x2:gx,y1:top,y2:plotBot,stroke:"#e6e6e6","stroke-width":1,opacity:tk.v===0?.8:.35}));
    const anchor=i===0?"start":(i===ticks.length-1?"end":"middle");
    const lab=el("text",{x:gx,y:plotBot+14,"text-anchor":anchor,"font-size":11,fill:"#9a9aa0"});
    lab.textContent=tk.t;svg.appendChild(lab);
  });
  if(p.unit){const u=el("text",{x:plotR,y:plotBot+26,"text-anchor":"end","font-size":11,fill:"#9a9aa0"});u.textContent=p.unit.trim();svg.appendChild(u);}

  p.rows.forEach((r,i)=>{
    const cy=top+i*rowH, by=cy+(rowH-18)/2, w=Math.max(0,x(r.value)-plotL);
    const g=el("g",{class:"row"});
    const lab=el("text",{x:plotL-8,y:cy+rowH/2+4,"text-anchor":"end","font-size":12,fill:r.hi?"#1a1a1a":"#9a9aa0","font-weight":r.hi?500:400});
    lab.textContent=r.label;g.appendChild(lab);
    g.appendChild(el("rect",{class:"bar",x:plotL,y:by,width:w,height:18,fill:r.hi?"#1a1a1a":"#9a9aa0",opacity:r.hi?1:.55,rx:1}));
    const val=el("text",{x:x(r.value)+8,y:cy+rowH/2+4,"text-anchor":"start","font-size":12,"font-weight":500,fill:r.hi?"#1a1a1a":"#9a9aa0"});
    val.textContent=r.disp ?? r.value;g.appendChild(val);
    const hit=el("rect",{class:"hit",x:0,y:cy,width:VBW,height:rowH,fill:"transparent"});
    hit.addEventListener("mousemove",e=>showTip(`<div class="t-cat">${r.label}</div><b>${r.disp ?? r.value}</b>${p.unit||""}`,e));
    hit.addEventListener("mouseleave",hideTip);g.appendChild(hit);
    svg.appendChild(g);
  });
  wrap.appendChild(svg);
  return wrap;
}

document.getElementById("title").textContent=TITLE;
const sub=document.getElementById("subtitle");if(SUBTITLE)sub.textContent=SUBTITLE;else sub.style.display="none";
const note=document.getElementById("note");if(NOTE)note.textContent=NOTE;else note.style.display="none";
const host=document.getElementById("panels");
PANELS.forEach(p=>host.appendChild(renderPanel(p)));
addEventListener("scroll",hideTip,true);
</script>
</body>
</html>

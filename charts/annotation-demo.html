<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kling-Critic 帧级标注 Demo</title>
<style>
/* 设计令牌 + reset：颜色、优先级调色板 P0–P4、字体栈 */
  :root{
    --bg:#ffffff; --bg-soft:#f6f7f9; --ink:#111418; --ink-soft:#5b636e; --ink-faint:#8b929c;
    --line:#e4e7ec; --brand:#2f6bff; --brand-soft:#eaf0ff;
    --subj:#8b5cf6; --subj-soft:#f3ecff; --subj-line:#e0d0ff;
    --warn:#e0701a; --warn-soft:#fff3e6; --warn-line:#ffd9b0;
    --dup:#d92c6a;  --dup-soft:#ffe9f1;  --dup-line:#ffc3d8;
    --stmt:#0ea5a3; --stmt-soft:#e2f7f6; --stmt-line:#a9e6e3;
    /* priority palette P0..P4 */
    --p0:#e5484d; --p0-soft:#ffeaea; --p0-line:#ffc9cb;
    --p1:#e0701a; --p1-soft:#fff1e3; --p1-line:#ffd6ac;
    --p2:#d4a017; --p2-soft:#fdf6e3; --p2-line:#f0e0a8;
    --p3:#2f6bff; --p3-soft:#eaf0ff; --p3-line:#cbdcff;
    --p4:#5b636e; --p4-soft:#eef1f4; --p4-line:#d8dde3;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:14px}
  .wrap{display:flex;flex-direction:column;height:100%}

/* 播放器主体样式：demo 选择条、视频列、grounding 框叠加层、时间轴、
   时间戳跳转芯片、深色 JSON 卡。modal 宿主与内联宿主共用这一份。
   组件源自 skills/chart-blocks/templates/frame-annotation-modal。
   仅依赖宿主的 --mono 令牌，其余颜色自带。 */
  .demostrip{display:flex;gap:7px;padding:11px 20px 0;flex-wrap:wrap;flex:none;background:#fff}
  .demopill{appearance:none;border:1px solid #d0d0d0;background:#f2f2f4;color:#555;
            font-family:inherit;font-size:11.5px;font-weight:650;padding:5px 12px;border-radius:999px;cursor:pointer;transition:.12s}
  .demopill:hover{border-color:#aaa;color:#1c1c1e}
  .demopill.on{background:#2f6bff;border-color:#2f6bff;color:#fff}
  /* two-column body: video left, json right — minmax(0,..) lets both columns shrink
     so neither can push its content past the modal frame */
  .mbody{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:0;min-height:0;overflow:auto}
  .vcol{padding:18px 20px;border-right:1px solid #e0e0e0;min-width:0;background:#fff;display:flex;flex-direction:column;min-height:0}
  .jcol{padding:16px;min-width:0;background:#f5f5f7;overflow:auto;display:flex}
  .vcap{font-size:12px;color:#6b6b6b;margin:0 0 10px}
  .vcap b{color:#1c1c1e;font-weight:700}
  /* stable 16:9 box: swapping demo src can no longer collapse/resize the frame (kills flicker) */
  .video-wrapper{position:relative;border-radius:11px;overflow:hidden;background:#000;line-height:0;aspect-ratio:16/9;max-height:56vh;flex:none}
  .video-wrapper video{width:100%;height:100%;display:block;object-fit:contain;cursor:pointer;opacity:1;transition:opacity .18s ease}

  /* ── frame-level grounding boxes, laid over the video ──
     The layer is sized/positioned by fitAnnotationLayer() to the video's OWN
     letterboxed content rect, not the wrapper — otherwise every box drifts by
     the size of the black bars. */
  .annotation-layer{position:absolute;z-index:2;pointer-events:none;overflow:visible;opacity:1;transition:opacity .18s ease}
  .annotation-box{position:absolute;border:2px solid #ff3b30;border-radius:3px;
                  box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 12px rgba(255,59,48,.38);
                  animation:annotationPulse 1.15s ease-in-out infinite alternate}
  .annotation-box[data-sev="2"]{border-color:#e0701a;box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 12px rgba(224,112,26,.38);animation:none}
  .annotation-box[data-sev="1"]{border-color:#d4a017;box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 12px rgba(212,160,23,.38);animation:none}
  .annotation-box span{position:absolute;left:-2px;top:-23px;max-width:260px;overflow:hidden;text-overflow:ellipsis;
                       white-space:nowrap;padding:3px 6px;border-radius:3px 3px 3px 0;background:rgba(155,18,15,.92);
                       color:#ffcbc7;font-size:11px;line-height:1.25;font-weight:700;letter-spacing:.2px;
                       text-shadow:0 1px 1px #000;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  .annotation-box[data-sev="2"] span{background:rgba(150,72,10,.92);color:#ffe0c4}
  .annotation-box[data-sev="1"] span{background:rgba(133,99,8,.92);color:#ffeec0}
  /* box hugging the top edge — flip the label inside so it isn't clipped away */
  .annotation-box.near-top span{top:2px;left:2px;border-radius:3px}
  @keyframes annotationPulse{
    from{border-color:#ff3b30}
    to{border-color:#ff7b72;box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 18px rgba(255,59,48,.62)}
  }

  .vcontrols{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:12px 14px 10px;
             background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;flex-direction:column;gap:9px;
             opacity:0;transition:opacity .2s}
  .video-wrapper:hover .vcontrols,.vcontrols.show{opacity:1}
  /* timeline / progress with problem-frame markers */
  .track{position:relative;height:22px;display:flex;align-items:center;cursor:pointer}
  .rail{position:absolute;left:0;right:0;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
  .rfill{position:absolute;left:0;height:5px;border-radius:3px;background:#3b82f6;width:0;pointer-events:none}
  .mark{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);
        border:2px solid #fff;cursor:pointer;transition:.12s;z-index:2}
  .mark:hover{transform:translate(-50%,-50%) scale(1.25)}
  .mark.act{box-shadow:0 0 0 3px rgba(255,255,255,.5)}
  .mark[data-sev="3"]{background:#e5484d}
  .mark[data-sev="2"]{background:#e0701a}
  .mark[data-sev="1"]{background:#d4a017}
  .crow{display:flex;align-items:center;gap:11px}
  .cbtn{background:none;border:0;padding:0;cursor:pointer;color:#fff;font-size:16px;line-height:1;flex:none;transition:opacity .2s}
  .cbtn:hover{opacity:.8}
  .ctime{font-size:11.5px;color:#e8e8ea;font-variant-numeric:tabular-nums;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .cspacer{flex:1}
  .jumpwrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .jump{appearance:none;border:1px solid #d0d0d0;background:#f2f2f4;color:#555;
        font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;cursor:pointer;transition:.12s;
        display:inline-flex;align-items:center;gap:6px}
  .jump:hover{border-color:#aaa;color:#1c1c1e}
  .jump.act{border-color:#3b82f6;color:#2f6bff;background:rgba(59,130,246,.1)}
  .jump .jd{width:7px;height:7px;border-radius:50%}
  .jump .jd[data-sev="3"]{background:#e5484d}.jump .jd[data-sev="2"]{background:#e0701a}.jump .jd[data-sev="1"]{background:#d4a017}
  /* json panel — dark editor card */
  .jcard{display:flex;flex-direction:column;width:100%;min-width:0;background:#1a1d24;border-radius:10px;
         overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.18);align-self:flex-start;max-height:100%}
  .jhead{display:flex;align-items:center;gap:8px;margin:0;padding:10px 14px;background:#0f1117;
         border-bottom:1px solid rgba(255,255,255,.08);flex:none}
  .jhead .jt{font-size:12.5px;font-weight:600;color:#9CA3AF;font-family:var(--mono)}
  .jhead .jc{margin-left:auto;font-size:15px;color:#9CA3AF;cursor:pointer;transition:.2s}
  .jhead .jc:hover{color:#F8FAFC}
  .jhead .jc.copied{color:#10B981}
  .jbodywrap{padding:14px 16px;overflow:auto;min-height:0}
  /* pre-wrap, not pre: `reasoning` is a full sentence and would otherwise run off
     the card into a horizontal scrollbar nobody finds */
  pre.json{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:#E5E7EB;white-space:pre-wrap;word-break:break-word}
  .json .jk{color:#60A5FA}.json .js{color:#34D399}.json .jn{color:#F59E0B}.json .jp{color:#6B7280}
  .jempty{color:#6B7280;font-size:12px;font-family:var(--mono);white-space:normal}
  @media(max-width:760px){.mbody{grid-template-columns:1fr}.vcol{border-right:0;border-bottom:1px solid #e0e0e0}}

/* 标注 modal 的壳：遮罩、窗口、macOS 标题栏与红黄绿灯。
   播放器主体样式在 45-player.css（与内联宿主共用），这里只管「弹窗」这层。
   body.kc-expanded 那几条是被父页 srcdoc 内联时的全屏协商，见 00-iframe.js。
   黄/绿灯是纯装饰，没有 handler —— 只有红灯接了 closeModal。 */
  .overlay{position:fixed;inset:0;background:rgba(12,15,20,.55);backdrop-filter:blur(3px);
           display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .overlay.on{display:flex}
  /* when a parent page has blown this iframe up to fullscreen, the host card is
     hidden and the overlay goes transparent — the parent dims+blurs the REAL page
     behind us, so the modal floats over the (blurred) page, not over our own card. */
  body.kc-expanded .wrap{visibility:hidden}
  /* background:transparent only takes effect once the modal is actually open (same
     frame as .overlay.on). Going transparent on button-click would land BEFORE the
     parent's scrim and flash the white page through. */
  body.kc-expanded.kc-modal-open{background:transparent}
  body.kc-expanded.kc-modal-open .overlay{background:transparent;backdrop-filter:none;padding:0}
  .modal{width:min(1240px,100%);max-height:92vh;background:#ffffff;color:#1c1c1e;border-radius:12px;
         overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  .mhead{display:flex;align-items:center;gap:10px;padding:13px 20px;background:#ebebeb;
         border-bottom:1px solid #d0d0d0;flex:none;min-height:44px}
  .mhead .mt{font-size:15px;font-weight:700;color:#1c1c1e}
  .mhead .mp{font-family:var(--mono);font-size:11px;color:#8e8e93}
  .mhead .mbadge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.03em;color:#fff}
  /* macOS traffic-light close/min/max buttons */
  .traflights{display:flex;align-items:center;gap:8px;margin-right:10px;flex:none}
  .tfl{appearance:none;border:0;padding:0;width:13px;height:13px;border-radius:50%;cursor:pointer;transition:.1s;flex:none}
  .tfl-r{background:#ff5f57}.tfl-r:hover{background:#e0443e}
  .tfl-y{background:#febc2e}.tfl-y:hover{background:#e0a325}
  .tfl-g{background:#28c840}.tfl-g:hover{background:#1eab32}
  /* demo selector strip */

/* 内联播放器宿主：把「标签体系里点 ▷ Play 弹出的那个 modal」原样摊平成页面里的
   一张静态卡片（Pointwise 数据示例用）。

   关键点：DOM 与样式都不另起一套 —— 内联版直接复用 html/50-modal.html 的 modal
   本体和 45-player.css / 50-modal.css 的全部样式，这里只做三件事：
     ① 解除 .overlay 的 fixed 定位，让它退化成普通文档流容器；
     ② 去掉弹窗特征（大投影、92vh 限高、圆角裁切保留）；
     ③ 隐藏只在弹窗里有意义的红黄绿灯（这里没有「关闭」这回事）。
   旧版这里是一套深色 .card/.head 外壳 + 逐条覆盖播放器颜色，等于把同一个组件
   维护了两遍（浅色一份、深色一份），两边样式已经开始漂移 —— 那正是要消掉的重复。 */
.inline-player{background:#f0f2f5;padding:18px}
/* overlay 退化：不再 fixed 铺满、不再变暗模糊，就是个居中的块 */
.inline-player .overlay{position:static;inset:auto;display:block;background:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;padding:0;z-index:auto}
.inline-player .modal{margin:0 auto;max-height:none;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08)}
/* 红黄绿灯是弹窗语义（关闭/最小化/最大化），静态卡片里没有对应动作 */
.inline-player .traflights{display:none}
/* 摊平后卡片高度由内容决定，副标题（原 modal 的面包屑）推到行尾更像页面标题栏 */
.inline-player .mhead .mp{margin-left:auto}
/* JSON 列：弹窗里是 92vh 高的固定框，摊平后没有那个高度约束，
   jcard 用 align-self:flex-start 就只包住文字，右侧留一大片空白。
   这里让它撑满整列，与左侧视频列齐高。 */
.inline-player .jcard{align-self:stretch}
.inline-player .jhint{max-width:1240px;margin:12px auto 0;font-size:11.5px;color:#6b7787;line-height:1.6}
</style>
</head>
<body class="inline-player">
<!-- 这里内联的就是 html/50-modal.html 那一份 modal 本体（含播放器），不另写一套：
     「Pointwise 数据实际呈现」与标签体系里点 ▷ Play 弹出的，必须是同一个组件。
     区别只在 60-inline.css 把它从悬浮弹窗摊平成页面里的静态卡片。 -->
<!-- 标注 modal：视频 + 帧级 grounding 框 + 帧级 JSON
     组件来自 skills/chart-blocks/templates/frame-annotation-modal，
     相比旧版新增：画面上的 grounding 框叠加层（#v-layer）与 #v-wrap 定位锚点。
     黄/绿灯为装饰，无 handler（macOS 观感），只有红灯关闭。 -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mhead">
      <div class="traflights">
        <button class="tfl tfl-r" id="m-close" aria-label="关闭" title="关闭"></button>
        <button class="tfl tfl-y" aria-label="最小化" title="最小化"></button>
        <button class="tfl tfl-g" aria-label="最大化" title="最大化"></button>
      </div>
      <span class="mt" id="m-title">标注数据</span>
      <span class="mbadge" id="m-badge" style="display:none"></span>
      <span class="mp" id="m-path"></span>
    </div>
    <div class="demostrip" id="m-strip"></div>
    <!-- 播放器主体：视频列（含 grounding 框叠加层）+ 帧级 JSON 列。
     modal 壳与内联卡片壳共用这一段，DOM id 是两者的契约。 -->
<div class="mbody">
  <div class="vcol">
    <p class="vcap" id="v-cap"></p>
    <div class="video-wrapper" id="v-wrap">
      <video id="v-el" playsinline preload="metadata"></video>
      <div class="annotation-layer" id="v-layer" aria-hidden="true"></div>
      <div class="vcontrols" id="v-controls">
        <div class="track" id="v-track">
          <div class="rail"></div>
          <div class="rfill" id="v-fill"></div>
        </div>
        <div class="crow">
          <button class="cbtn" id="v-play" aria-label="播放/暂停">▶</button>
          <span class="ctime" id="v-time">0:00 / 0:00</span>
          <span class="cspacer"></span>
          <button class="cbtn" id="v-mute" aria-label="静音">🔊</button>
        </div>
      </div>
    </div>
    <div class="jumpwrap" id="v-jumps"></div>
  </div>
  <div class="jcol">
    <div class="jcard">
      <div class="jhead">
        <span class="jt">frame-annotation.json</span>
        <span class="jc" id="j-copy" title="复制">⧉</span>
      </div>
      <div class="jbodywrap">
        <pre class="json" id="j-body"><span class="jempty">点击进度条上的问题帧标记查看该帧标注。</span></pre>
      </div>
    </div>
  </div></div>
  </div>
</div>
<p class="jhint">每条 5–15s 视频标注它存在的所有质检问题。核心字段：dimension（命中三级标签）、time（问题帧时刻）、grounding（画面坐标）、severity（严重度）、reasoning（判定理由，强制字段）。</p>
<script>
// ── 数据块：由 tools/gen-chart.mjs 从 data/tag-system.json 生成，勿手改 ──
//   要改标签、优先级、rubric、边界规则 → 改 data/tag-system.json 后重跑生成器。
//   故意压成单行：美化缩进会让本文件膨胀到 4000+ 行，可读的是 JSON 源文件。
const ISSUES = {"collapse":{"kind":"confusion","label":"混淆","title":"崩坏 ↔ 合理性·结构异常 / 主体间交互","desc":"「明显 / 轻微崩坏」与「合理性」下的结构异常（生物 / 非生物）、主体间交互，都在描述“画面内容坏掉”。标注员难以稳定区分：整体不可辨识算崩坏，还是主体可辨识但局部结构 / 交互错误。","members":["明显崩坏","轻微崩坏","生物类结构异常","非生物结构异常","主体间交互"],"fix":"约定判定优先级：主体已不可辨识 → <b>崩坏</b>；主体可辨识但结构 / 交互错误 → <b>合理性·结构异常 / 主体间交互</b>。两者互斥、不可并存，并补充各档锚点示例视频。"},"temporal":{"kind":"dup","label":"重复","title":"动态时序一致性 / 光影风格时序一致性 ↔ 一致性·(时序 / 风格)","desc":"动态质量下的「动态时序一致性」「光影风格时序一致性」与一致性维度下的时序连贯 / 风格一致性语义重叠，同一现象可能被同时打到两个维度。","members":["动态时序一致性","光影风格时序一致性","风格一致性","叙事连贯性","镜头连贯性"],"fix":"按作用范围收敛到单一归属：<b>跨镜头 / 长程</b>一致性归「一致性」维度；<b>单镜头内逐帧</b>抖动 / 风格漂移归「动态质量」。避免同一 trial 双记。"},"audio":{"kind":"dup","label":"重复","title":"动态美学·音频项 ↔ 音频评测维度","desc":"「动态美学及视听叙事」下的 音频基础质量差 / 音画不同步 / 音画不匹配，与独立的「音频评测维度」（音质、音画同步·音画不匹配）重复。","members":["音频基础质量差","音画不同步","音画不匹配","失真感知","口型匹配度"],"fix":"音频客观判定统一收到「<b>音频评测维度</b>」；「动态美学」仅保留与叙事 / 情绪耦合的纯主观视听项，删除与音频维度重复的客观项。"}};

// ── 全屏放大：当本图表被父页面以 iframe 内联（srcdoc）时，position:fixed 只能铺满
//    iframe 自身视口（高仅 ~800px），modal 会被裁。打开 modal 时通知父页面把这个
//    iframe 放大到全屏，关闭时还原。子页面无法拿到真实 URL，所以不能走「父页加载
//    popup URL」的老路——只发消息，图表和 modal 都留在原 iframe 里运行。──
const IN_IFRAME = (window !== window.top);
let pendingOpen = null;   // 被内联时，等父页 iframe 放大到全屏(kc-expand-ack)后再开 modal
let revealTimer = null;   // 关闭时，等父页把 iframe 缩回行内尺寸(kc-collapse-ack)后再放出图表

// ── 「这一帧真的上屏了」才回调 ───────────────────────────────────────────────
// rAF 的回调跑在绘制之「前」，所以在 rAF 里通知父页「我画好了」是错的：父页立刻
// 显影，而跨进程合成器手上还是子页的上一帧（刚按全屏重排、但还没加 class 的标签树）
// —— 那就是 flash.png 里那片「清晰的全屏标签树盖在模糊页面上」。
// 连续两次 rAF 之间必然跨过一个完整的帧边界，即上一帧已提交合成；再挂一个
// setTimeout 0 兜住「后台标签页 / 隐藏 iframe 里 rAF 根本不跑」的情况。
function afterPaint(fn){
  let done = false;
  const go = () => { if (done) return; done = true; fn(); };
  requestAnimationFrame(() => requestAnimationFrame(go));
  setTimeout(go, 120);
}

// ── 素材路径：相对「项目根」而不是相对本文档 ─────────────────────────────────
// demo.src 在 data/tag-system.json 里写成 `assets/videos/x.mp4`，即相对项目根。
// 这份 HTML 有四种加载方式，各自的 baseURI 不同：
//   · charts/tag-system.html            直接打开  → base 是 charts/
//   · eval/charts/tag-system.html       直接打开  → base 是 eval/charts/
//   · charts/annotation-demo.html       直接打开  → base 是 charts/
//   · build.py 把上面任一份内联成 srcdoc → base 是父页 index.html（项目根）
// srcdoc 文档没有自己的 URL（location 是 about:srcdoc），相对路径按父页解析，
// 所以曾经写死的 `../assets/…` 在博客里会跑到项目根的上一层，视频 404、
// video.error.code=4（Format error）——表现就是「视频不能播放」。
// 这里统一把 base 归一到项目根：截到最后一个 / 为止，再剥掉 charts/、eval/。
//
// 注意：这段刻意不用正则，全用字符串操作。build.py 会把本文件内联进 index.html
// 的 markdown，而 SPA 端 renderDoc 会把一行里成对的美元符号当成行内公式抽走再还原，
// 还原时不解码 &#10; —— 正则里的行尾锚点成对出现就会被吃掉，整段 JS 变成
// SyntaxError，播放器直接不启动。tools/verify.mjs 有一条检查守着这件事。
const ASSET_BASE = (() => {
  const url = document.baseURI.split('#')[0].split('?')[0];
  let dir = url.slice(0, url.lastIndexOf('/') + 1);
  if (dir.endsWith('/charts/')) dir = dir.slice(0, -'charts/'.length);
  if (dir.endsWith('/eval/'))   dir = dir.slice(0, -'eval/'.length);
  return dir;
})();
const srcOf = d => (d.src.indexOf('//') === 0 || d.src.indexOf(':') > -1 || d.src[0] === '/')
                     ? d.src : ASSET_BASE + d.src;

// 面板里吐的 JSON 必须与 data/data.md 里公布的标注协议同构 —— 那份是对外的
// schema，demo 是它的实例，两边键名对不上就等于给了两套协议。

//   bbox                ← grounding 的像素坐标，从 [x1,y1,x2,y2] 转成协议规定的 [y1,x1,y2,x2]
//   observation         ← 帧上已有的客观描述
//   instruction_expect  ← 协议规定「仅当存在参考素材或生成指令时填写」，demo 没有参考素材，故缺省不出现
const FPS = 4;                       // 质检抽帧口径：4 fps
function pxBox(f){                   // "bbox: [x1,y1,x2,y2]" -> [y1,x1,y2,x2]
  const m = /\[([\d\s,.-]+)\]/.exec(f.grounding || '');
  if (!m) return undefined;
  const n = m[1].split(',').map(v => Number(v.trim()));
  if (n.length !== 4 || n.some(v => !isFinite(v))) return undefined;
  return [n[1], n[0], n[3], n[2]];
}
// 真实数据集里这些字段本来就有（人工画框 / 模型标注都按同一份协议存），
// 有就直接用，只有旧的手写 demo 才需要从 time/hold 反推。
function frameObj(f, i){
  const fr  = f.frame != null ? f.frame
            : (f.time != null ? Math.round(f.time*FPS) : undefined);
  const end = (fr!=null) ? fr + Math.max(1, Math.round(holdOf(f)*FPS)) : undefined;
  return { evidence_id: f.evidence_id || String((i!=null?i:0)+1),
           frame: fr,
           bbox: f.bbox || pxBox(f),
           frame_range: f.frame_range || ((fr!=null && end!=null) ? [fr, end] : undefined),
           instruction_expect: f.instruction_expect,
           observation: f.observation || f.reasoning,
           dimension: f.dimension };
}
function jsonHTML(f, i){
  const obj = frameObj(f, i);
  const lines = ['<span class="jp">{</span>'];
  const keys = Object.keys(obj).filter(k => obj[k] !== undefined);
  keys.forEach((k,i) => {
    const comma = i < keys.length-1 ? '<span class="jp">,</span>' : '';
    const v = obj[k];
    const val = typeof v==='number'
      ? '<span class="jn">'+v+'</span>'
      : Array.isArray(v)
        ? '<span class="jp">[</span><span class="jn">'+v.join('</span><span class="jp">, </span><span class="jn">')+'</span><span class="jp">]</span>'
        : '<span class="js">"'+String(v).replace(/</g,'&lt;')+'"</span>';
    lines.push('  <span class="jk">"'+k+'"</span><span class="jp">: </span>'+val+comma);
  });
  lines.push('<span class="jp">}</span>');
  return lines.join('\n');
}
// ── timeline markers + jump chips ─────────────────────────────────────────
const demoDur = d => Math.max(...d.frames.map(f=>f.time)) + 3;

function renderJumps(demo){
  vJumps.innerHTML = '';
  demo.frames.forEach((f,i) => {
    const b = document.createElement('button');
    b.className = 'jump'; b.dataset.i = i;
    b.innerHTML = '<span class="jd" data-sev="'+sevOf(f)+'"></span>'+f.time.toFixed(1)+'s · '+f.dimension;
    b.onclick = () => gotoFrame(i, true);
    vJumps.appendChild(b);
  });
}
function renderMarks(demo){
  if (!demo) return;
  vTrack.querySelectorAll('.mark').forEach(m => m.remove());
  // duration isn't known until loadedmetadata — place provisionally, redo later
  const dur = vEl.duration || demoDur(demo);
  demo.frames.forEach((f,i) => {
    const m = document.createElement('div');
    m.className = 'mark'; m.dataset.sev = sevOf(f); m.dataset.i = i;
    m.style.left = Math.min(99, (f.time/dur)*100) + '%';
    m.title = f.time.toFixed(1)+'s · '+f.dimension;
    m.onclick = e => { e.stopPropagation(); gotoFrame(i, true); };
    vTrack.appendChild(m);
  });
  if (curFrame >= 0) markActive(curFrame);
}
function markActive(i){
  document.querySelectorAll('.jump').forEach(j => j.classList.toggle('act', +j.dataset.i === i));
  document.querySelectorAll('.mark').forEach(m => m.classList.toggle('act', +m.dataset.i === i));
}
// ── grounding boxes ───────────────────────────────────────────────────────
// Size the annotation layer to the video's real content rect. `object-fit:contain` letterboxes
// the picture inside the wrapper, so box percentages are only meaningful against
// that inner rect — measuring the wrapper instead offsets every box by the bars.
function fitAnnotationLayer(){
  const cw = vWrap.clientWidth, ch = vWrap.clientHeight;
  const sw = vEl.videoWidth || 16, sh = vEl.videoHeight || 9;
  if (!cw || !ch) return;                      // modal still display:none — nothing to fit
  const scale = Math.min(cw/sw, ch/sh);
  const w = sw*scale, h = sh*scale;
  vLayer.style.width = w+'px';   vLayer.style.height = h+'px';
  vLayer.style.left = (cw-w)/2+'px'; vLayer.style.top = (ch-h)/2+'px';
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// A frame's box shows while the playhead is inside [time, time+hold). The selected
// frame also stays boxed while paused, so clicking a marker always shows the box
// even when hold has been scrubbed past.
function activeFrames(){
  const demo = curDemo(); if (!demo) return [];
  const t = vEl.currentTime || 0;
  const set = new Set();
  demo.frames.forEach((f,i) => { if (t >= f.time && t < f.time + holdOf(f)) set.add(i); });
  if (vEl.paused && curFrame >= 0) set.add(curFrame);
  return [...set];
}
function renderBoxes(){
  const demo = curDemo(); if (!demo) return;
  vLayer.innerHTML = activeFrames().map(i => {
    const f = demo.frames[i]; if (!f.box) return '';     // no box → degrade to JSON-only
    const b = f.box;
    const nearTop = b.y < 8 ? ' near-top' : '';
    return '<div class="annotation-box'+nearTop+'" data-sev="'+sevOf(f)+'"'
         + ' style="left:'+b.x+'%;top:'+b.y+'%;width:'+b.w+'%;height:'+b.h+'%">'
         + '<span>'+esc(f.dimension + (f.target ? ' · '+f.target : ''))+'</span></div>';
  }).join('');
}
// ── navigation ────────────────────────────────────────────────────────────
function gotoFrame(i, seek){
  curFrame = i;
  const f = curDemo().frames[i];
  if (seek){
    if (isFinite(vEl.duration)){ vEl.currentTime = f.time; vEl.pause(); }
    else pendingSeek = f.time;   // metadata not in yet — replay the seek on load
  }
  jBody.innerHTML = jsonHTML(f, i);
  markActive(i);
  renderBoxes();
}

function loadDemo(idx){
  curIdx = idx; curFrame = -1; pendingSeek = null;
  const demo = curDemo();
  document.querySelectorAll('.demopill').forEach(p => p.classList.toggle('on', +p.dataset.i === idx));
  document.getElementById('v-cap').innerHTML = demo.caption || '';
  jBody.innerHTML = '<span class="jempty">点击进度条上的问题帧标记查看该帧标注。</span>';
  // fade out before swapping src so the empty/black frame between demos doesn't flash
  vEl.style.opacity = '0'; vLayer.style.opacity = '0';
  vLayer.innerHTML = '';
  vEl.src = srcOf(demo); vEl.load(); vEl.muted = true; vMute.textContent = '🔊';
  vFill.style.width = '0%';
  renderJumps(demo);
  renderMarks(demo);                       // provisional; refined on loadedmetadata
  if (AUTOSELECT_FIRST && demo.frames.length) gotoFrame(0, true);
}



// ── 宿主入口 ──────────────────────────────────────────────────────────────
// 换一组 demo 并渲染第一条。壳负责在调用前把自己显示出来（modal 加 .on / 内联无操作），
// 否则 wrapper 尺寸为 0，fitAnnotationLayer 量不到东西。
function mountDemos(demos){
  curDemos = demos || [];
  if (!curDemos.length) return false;
  const strip = document.getElementById('m-strip');
  if (strip){
    strip.innerHTML = '';
    curDemos.forEach((d, i) => {
      const p = document.createElement('button');
      p.className = 'demopill' + (i === 0 ? ' on' : '');
      p.dataset.i = i; p.textContent = d.label;
      p.onclick = () => loadDemo(i);
      strip.appendChild(p);
    });
  }
  loadDemo(0);
  requestAnimationFrame(fitAnnotationLayer);   // 壳刚显示，布局完成后再量
  return true;
}

// ── video wiring ──────────────────────────────────────────────────────────
vEl.addEventListener('loadedmetadata', () => {
  renderMarks(curDemo());
  vTime.textContent = '0:00 / '+fmt(vEl.duration);
  fitAnnotationLayer();
  if (pendingSeek != null){ vEl.currentTime = pendingSeek; pendingSeek = null; vEl.pause(); }
});
vEl.addEventListener('loadeddata', () => { vEl.style.opacity='1'; vLayer.style.opacity='1'; fitAnnotationLayer(); renderBoxes(); });
vEl.addEventListener('seeked', renderBoxes);
vEl.addEventListener('timeupdate', () => {
  const r = vEl.currentTime / (vEl.duration || 1);
  vFill.style.width = (r*100)+'%';
  vTime.textContent = fmt(vEl.currentTime)+' / '+fmt(vEl.duration);
  renderBoxes();
});
vEl.addEventListener('play',  () => { vPlay.textContent='⏸'; vCtrls.classList.add('show'); });
vEl.addEventListener('pause', () => { vPlay.textContent='▶'; vCtrls.classList.remove('show'); renderBoxes(); });
vPlay.onclick = () => { vEl.paused ? vEl.play() : vEl.pause(); };
vEl.onclick   = () => { vEl.paused ? vEl.play() : vEl.pause(); };
vMute.onclick = () => { vEl.muted = !vEl.muted; vMute.textContent = vEl.muted ? '🔇' : '🔊'; };
addEventListener('resize', fitAnnotationLayer);

// ── draggable progress ────────────────────────────────────────────────────
let dragging = false;
function seekAt(e){
  const rect = vTrack.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX);
  const r = Math.max(0, Math.min(1, (x - rect.left)/rect.width));
  if (isFinite(vEl.duration)) vEl.currentTime = r * vEl.duration;
}
vTrack.addEventListener('mousedown', e => { if(e.target.classList.contains('mark')) return; dragging=true; vCtrls.classList.add('show'); seekAt(e); });
document.addEventListener('mousemove', e => { if(dragging) seekAt(e); });
document.addEventListener('mouseup',   () => { if(dragging){ dragging=false; vCtrls.classList.remove('show'); } });
// ── copy json ─────────────────────────────────────────────────────────────
document.getElementById('j-copy').onclick = () => {
  if (curFrame < 0) return;
  const obj = frameObj(curDemo().frames[curFrame], curFrame);
  Object.keys(obj).forEach(k => obj[k] === undefined && delete obj[k]);
  navigator.clipboard.writeText(JSON.stringify(obj, null, 2)).then(() => {
    const c = document.getElementById('j-copy'); c.classList.add('copied'); c.textContent='✓';
    setTimeout(() => { c.classList.remove('copied'); c.textContent='⧉'; }, 1600);
  });
};

// ══════════════════════════════════════════════════════════════════════════
// 内联播放器启动 —— Pointwise 数据示例（charts/annotation-demo.html）
// ══════════════════════════════════════════════════════════════════════════
// 用的是与标签体系完全相同的 modal 组件（html/50-modal.html），只是被
// 60-inline.css 摊平成静态卡片：没有开关弹窗那一层，页面加载完直接挂 demo。
// 数据取自 data/tag-system.json 的 demos —— 与标签体系同一份，不再像旧版那样
// 在 HTML 里另抄一份 3 条子集。

// 展示顺序固定：先崩坏（结构类），再六指（局部结构），再字幕（文字类），
// 覆盖三种不同的缺陷形态和三段不同素材。DEMOS 的键就是标签名。
const INLINE_KEYS = ["文字不可读", "崩坏", "生物类结构异常", "主体未响应"];

const inlineDemos = INLINE_KEYS.flatMap(k => (DEMOS[k] || []).map(d => ({
  ...d,
  // 内联版没有标题栏可放标签名，把它并进 pill 文案里
  // An empty label means the tag name says it all (public-set clips had a
  // redundant "VideoFeedback · <id>" tail); otherwise append the demo's own name.
  label: d.label ? k + ' · ' + d.label.replace(/^demo-\d+\s*·\s*/, '') : k,
})));

// modal 的标题栏在这里成了卡片头：填成这份 demo 的说明，而不是某个标签名。
document.getElementById('m-title').textContent = 'Pointwise 帧级标注';
document.getElementById('m-path').textContent  = '点击进度条问题帧或时间戳查看该帧 JSON';

if (!mountDemos(inlineDemos)) {
  document.getElementById('j-body').innerHTML =
    '<span class="jempty">data/tag-system.json 的 demos 里没有这几个键：'
    + INLINE_KEYS.join(' / ') + '</span>';
}
</script>
</body>
</html>
